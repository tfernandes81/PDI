<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDI</title>
<meta name="description" content="Meu Plano de Desenvolvimento Individual: onde estou, onde quero chegar e como vou chegar lá.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F7; --ink:#14213D; --muted:#51607F;
  --cobalt:#2447F5; --sun:#FFC93C; --line:#C9D1E3; --white:#fff;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 1.0625rem/1.65 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:4px}
.wrap{width:min(1080px,100% - 2.5rem);margin-inline:auto}
h1,h2,h3{font-family:var(--display);line-height:1.02;letter-spacing:-.025em}
h2{font-size:clamp(2rem,5vw,3.25rem);font-weight:800;max-width:16ch}
p{max-width:62ch}

/* ===== HERO ===== */
.hero{background:var(--cobalt);color:var(--white);padding:1.25rem 0 0;overflow:hidden;position:relative}
.nav{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-weight:600;font-size:.95rem}
.nav nav{display:flex;gap:1.5rem;flex-wrap:wrap}
.nav a{text-decoration:none;opacity:.85}.nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:2rem;align-items:end;padding:clamp(3rem,9vw,7rem) 0 0}
.hero h1{font-size:clamp(3.2rem,11vw,8.5rem);font-weight:800;letter-spacing:-.045em}
.hero h1 span{display:block;color:var(--sun)}
.hero p.lead{margin-top:1.75rem;font-size:1.25rem;color:#DCE4FF}
.portrait{position:relative;justify-self:end;width:100%;max-width:420px;aspect-ratio:4/5;overflow:hidden;border-radius:24px 24px 0 0;background:#1B38C4}
.portrait img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.portrait .hero-meta{position:absolute;inset:auto 0 0 0;padding:4rem 1.5rem 1.5rem;background:linear-gradient(to top,rgba(20,33,61,.94) 15%,rgba(20,33,61,0))}
.hero-meta{display:grid;gap:.9rem}
.hero-meta div{border-left:4px solid var(--sun);padding-left:1rem}
.hero-meta dt{font-size:.9rem;color:#B9C7FF}
.hero-meta dd{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.2}
/* escada de crescimento: a assinatura da página */
.steps{display:flex;align-items:flex-end;gap:0;height:clamp(70px,12vw,140px)}
.steps i{flex:1;background:var(--paper);transform-origin:bottom;transform:scaleY(0);animation:grow .9s cubic-bezier(.2,.8,.2,1) forwards}
.steps i:nth-child(1){height:18%;animation-delay:.1s}.steps i:nth-child(2){height:30%;animation-delay:.2s}
.steps i:nth-child(3){height:44%;animation-delay:.3s}.steps i:nth-child(4){height:60%;animation-delay:.4s}
.steps i:nth-child(5){height:78%;animation-delay:.5s}.steps i:nth-child(6){height:100%;animation-delay:.6s;background:var(--sun)}
@keyframes grow{to{transform:scaleY(1)}}

/* ===== SEÇÕES ===== */
section{padding:clamp(4rem,9vw,7rem) 0}
.sec-head{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:end;margin-bottom:3rem}
.sec-head p{color:var(--muted)}

/* competências: hoje x meta */
.skills{display:grid;gap:1.75rem}
.skill{display:grid;grid-template-columns:minmax(150px,1fr) 3fr;gap:1.5rem;align-items:center}
.skill h3{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.skill small{display:block;color:var(--muted);font-size:.9rem}
.track{position:relative;height:18px;background:var(--line);border-radius:99px}
.track .goal{position:absolute;inset:0 auto 0 0;width:calc(var(--goal)*1%);background:repeating-linear-gradient(135deg,var(--sun) 0 6px,#FFDB74 6px 12px);border-radius:99px}
.track .now{position:absolute;inset:0 auto 0 0;width:calc(var(--now)*1%);background:var(--cobalt);border-radius:99px;transform-origin:left;animation:fill 1.2s .5s cubic-bezier(.2,.8,.2,1) backwards}
.track .pin{position:absolute;top:-6px;left:calc(var(--goal)*1%);transform:translateX(-50%);width:4px;height:30px;background:var(--ink);border-radius:2px}
@keyframes fill{from{transform:scaleX(0)}}
.legend{display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:2rem;font-size:.95rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:.5rem;vertical-align:-2px;background:var(--c)}

/* metas */
.goals-bg{background:var(--ink);color:var(--white)}
.goals-bg .sec-head p{color:#AEBBDA}
.goal-item{border-top:1px solid #34456B}
.goal-item:last-child{border-bottom:1px solid #34456B}
.goal-item summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;padding:1.5rem 0}
.goal-item summary::-webkit-details-marker{display:none}
.goal-item h3{font-size:clamp(1.3rem,3vw,1.9rem);font-weight:700}
.badge{font-weight:600;font-size:.9rem;padding:.35rem .9rem;border-radius:99px;background:#26375E;white-space:nowrap}
.badge.go{background:var(--sun);color:var(--ink)}
.badge.ok{background:var(--cobalt)}
.goal-item summary::after{content:"+";grid-column:2;font:700 1.6rem var(--display);justify-self:end;transition:transform .25s}
.goal-item[open] summary::after{transform:rotate(45deg)}
.goal-body{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;padding:0 0 2rem;color:#C9D4EE}
.goal-body b{display:block;color:var(--sun);font-family:var(--display);margin-bottom:.35rem}

/* cronograma: sequência real */
.timeline{list-style:none;padding:0;position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem}
.timeline::before{content:"";position:absolute;top:13px;left:0;right:0;height:3px;background:var(--line)}
.timeline li{position:relative;padding-top:3rem}
.timeline li::before{content:"";position:absolute;top:0;left:0;width:28px;height:28px;border-radius:50%;background:var(--paper);border:4px solid var(--cobalt)}
.timeline li.done::before{background:var(--cobalt)}
.timeline li.now::before{background:var(--sun);border-color:var(--ink)}
.timeline h3{font-size:1.5rem;font-weight:800}
.timeline time{display:block;color:var(--muted);font-size:.9rem;margin-bottom:.5rem}
.timeline p{font-size:1rem}

/* aprendizado */
.learn{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
.learn article{background:var(--white);padding:1.75rem;border-radius:20px 20px 20px 4px}
.learn article:nth-child(2){border-radius:20px 4px 20px 20px}
.learn h3{font-size:1.3rem;font-weight:700;margin-bottom:.75rem}
.learn ul{padding-left:1.1rem;color:var(--muted)}
.learn li{margin-bottom:.4rem}

footer{background:var(--cobalt);color:var(--white);padding:4rem 0 3rem}
footer h2{font-size:clamp(2.5rem,8vw,6rem);max-width:none}
footer p{margin-top:1rem;color:#DCE4FF}
footer a{font-weight:600}

@media (max-width:820px){
  .portrait{justify-self:center;max-width:360px}
  .hero-grid,.sec-head,.skill,.goal-body,.learn{grid-template-columns:1fr}
  .timeline{grid-template-columns:1fr;gap:2rem}
  .timeline::before{top:0;bottom:0;left:13px;right:auto;width:3px;height:auto}
  .timeline li{padding:0 0 0 3.25rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .steps i{transform:none}
}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="nav">
      <strong id="marca"></strong>
      <nav aria-label="Seções">
        <a href="#hoje">Onde estou</a><a href="#metas">Metas</a><a href="#caminho">Cronograma</a><a href="#estudos">Estudos</a>
      </nav>
    </div>
    <div class="hero-grid">
      <div>
        <h1 id="titulo"></h1>
        <p class="lead" id="apresentacao"></p>
      </div>
      <div class="portrait">
        <img id="foto" src="" alt="" width="840" height="1050" fetchpriority="high">
        <dl class="hero-meta">
          <div><dt>Período</dt><dd id="periodo"></dd></div>
          <div><dt>Próximo cargo</dt><dd id="proximoCargo"></dd></div>
          <div><dt>Revisão com gestor</dt><dd id="revisao"></dd></div>
        </dl>
      </div>
    </div>
    <div class="steps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</header>

<main>
<section id="hoje">
  <div class="wrap">
    <div class="sec-head">
      <h2 id="t-competencias"></h2>
      <p id="d-competencias"></p>
    </div>
    <div class="skills" id="skills"></div>
    <div class="legend">
      <span style="--c:var(--cobalt)">Nível atual</span>
      <span style="--c:var(--sun)">Meta do ano</span>
    </div>
  </div>
</section>

<section id="metas" class="goals-bg">
  <div class="wrap">
    <div class="sec-head">
      <h2 id="t-metas"></h2>
      <p id="d-metas"></p>
    </div>
    <div id="goals"></div>
  </div>
</section>

<section id="caminho">
  <div class="wrap">
    <div class="sec-head">
      <h2 id="t-cronograma"></h2>
      <p id="d-cronograma"></p>
    </div>
    <ol class="timeline" id="timeline"></ol>
  </div>
</section>

<section id="estudos" style="padding-top:0">
  <div class="wrap">
    <div class="sec-head">
      <h2 id="t-estudos"></h2>
      <p id="d-estudos"></p>
    </div>
    <div class="learn" id="learn"></div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <h2 id="rodape-titulo"></h2>
    <p id="rodape-texto"></p>
  </div>
</footer>

<script src="dados.js"></script>
<script>
(function(){
  var D=window.PDI;
  if(!D){document.querySelector('main').innerHTML='<div class="wrap" style="padding:4rem 0"><h2>Não achei o dados.js</h2><p>Confira se o arquivo dados.js está na mesma pasta do index.html.</p></div>';return;}
  var $=function(id){return document.getElementById(id)};
  var el=function(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
  var safe=function(u){return /^(https?:|mailto:)/i.test(u)?u:'#'};

  var P=D.perfil;
  document.title='PDI '+P.ano+' · '+P.nome;
  $('marca').textContent='PDI '+P.ano;
  var h1=$('titulo');h1.append(P.tituloLinha1);h1.appendChild(el('span',null,P.tituloLinha2));
  $('apresentacao').textContent=P.apresentacao;
  $('foto').src=P.foto;$('foto').alt=P.fotoAlt||P.nome;
  $('periodo').textContent=P.periodo;
  $('proximoCargo').textContent=P.proximoCargo;
  $('revisao').textContent=P.revisao;

  [['competencias'],['metas'],['cronograma'],['estudos']].forEach(function(k){
    $('t-'+k[0]).textContent=D[k[0]].titulo;
    $('d-'+k[0]).textContent=D[k[0]].descricao;
  });

  D.competencias.itens.forEach(function(c){
    var row=el('div','skill'),l=el('div');
    l.appendChild(el('h3',null,c.nome));
    l.appendChild(el('small',null,'Atual '+c.atual+' → meta '+c.meta));
    var t=el('div','track');t.style.setProperty('--now',c.atual);t.style.setProperty('--goal',c.meta);
    t.append(el('span','goal'),el('span','now'),el('span','pin'));
    row.append(l,t);$('skills').appendChild(row);
  });

  D.metas.itens.forEach(function(m){
    var d=el('details','goal-item');if(m.aberta)d.open=true;
    var sm=el('summary');sm.appendChild(el('h3',null,m.titulo));
    var b=el('span','badge'+(m.situacao==='andamento'?' go':m.situacao==='concluida'?' ok':''),m.status);
    sm.appendChild(b);
    var body=el('div','goal-body');
    [['Ação',m.acao],['Resultado esperado',m.resultado],['Prazo',m.prazo]].forEach(function(f){
      var x=el('div');x.appendChild(el('b',null,f[0]));x.append(f[1]);body.appendChild(x);
    });
    d.append(sm,body);$('goals').appendChild(d);
  });

  D.cronograma.itens.forEach(function(c){
    var li=el('li',c.fase==='feito'?'done':c.fase==='atual'?'now':'');
    li.append(el('time',null,c.periodo),el('h3',null,c.titulo),el('p',null,c.texto));
    $('timeline').appendChild(li);
  });

  D.estudos.grupos.forEach(function(g){
    var a=el('article');a.appendChild(el('h3',null,g.titulo));
    var ul=el('ul');g.itens.forEach(function(i){ul.appendChild(el('li',null,i))});
    a.appendChild(ul);$('learn').appendChild(a);
  });

  var R=D.rodape;
  $('rodape-titulo').textContent=R.titulo;
  var rt=$('rodape-texto');rt.append(R.texto+' ');
  R.links.forEach(function(l,i){
    var a=el('a',null,l.nome);a.href=safe(l.url);a.target='_blank';a.rel='noopener';
    rt.appendChild(a);if(i<R.links.length-1)rt.append(' · ');
  });
})();
</script>
</body>
</html>
